<!-- wwwroot/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario del depósito</title>
  <style>
    :root { --azul:#2563eb; --verde:#16a34a; --rojo:#dc2626; --gris:#64748b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:#f1f5f9; color:#0f172a; }
    header { background:var(--azul); color:#fff; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; }
    header h1 { margin:0; font-size:1.4rem; }
    header a { color:#fff; margin-left:1rem; font-weight:600; text-decoration:none; }
    header a:hover { text-decoration:underline; }
    main { max-width:960px; margin:1.5rem auto; padding:0 1rem; display:grid; gap:1.25rem; }
    section { background:#fff; border-radius:12px; padding:1.25rem; box-shadow:0 1px 3px rgba(0,0,0,.12); }
    h2 { margin:0 0 .8rem; font-size:1.1rem; }
    .tag { font-size:.7rem; background:#e0e7ff; color:#3730a3; padding:.15rem .55rem; border-radius:999px; margin-left:.5rem; vertical-align:middle; }
    form { display:flex; gap:.5rem; flex-wrap:wrap; }
    input { padding:.5rem .7rem; border:1px solid #cbd5e1; border-radius:8px; font-size:.95rem; }
    button { padding:.45rem .8rem; border:0; border-radius:8px; background:var(--azul); color:#fff; font-weight:600; cursor:pointer; }
    button.verde { background:var(--verde); } button.rojo { background:var(--rojo); } button.gris { background:var(--gris); }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:.55rem .4rem; border-bottom:1px solid #e2e8f0; }
    .acciones { display:flex; gap:.3rem; flex-wrap:wrap; }
    .badge { padding:.15rem .6rem; border-radius:999px; font-weight:700; }
    .ok { background:#dcfce7; color:#166534; } .bajo { background:#fee2e2; color:#991b1b; }
    #aviso { display:none; padding:.7rem 1rem; border-radius:8px; }
    #aviso.exito { display:block; background:#dcfce7; color:#166534; }
    #aviso.error { display:block; background:#fee2e2; color:#991b1b; }
    .vacio { color:var(--gris); }
  </style>
</head>
<body>
  <header>
    <h1>📦 Inventario del depósito</h1>
    <nav><a href="/swagger" target="_blank">Swagger (REST)</a><a href="/graphql" target="_blank">GraphQL</a></nav>
  </header>

  <main>
    <div id="aviso"></div>

    <section>
      <h2>Nuevo producto <span class="tag">REST · POST</span></h2>
      <form id="form-producto">
        <input id="nombre" placeholder="Nombre del producto" required>
        <input id="stockMinimo" type="number" min="0" value="5" title="Stock mínimo">
        <button>Crear</button>
      </form>
    </section>

    <section>
      <h2>Productos <span class="tag">REST · GET</span></h2>
      <table>
        <thead><tr><th>ID</th><th>Nombre</th><th>Stock</th><th>Mínimo</th><th>Acciones</th></tr></thead>
        <tbody id="productos"></tbody>
      </table>
    </section>

    <section>
      <h2>⚠️ Stock bajo <span class="tag">GraphQL · query</span></h2>
      <ul id="stock-bajo"></ul>
    </section>

    <section id="panel-historial" hidden>
      <h2 id="titulo-historial"></h2>
      <table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th><th>Observación</th></tr></thead>
        <tbody id="movimientos"></tbody>
      </table>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    // Evita que un nombre con "<" rompa la página (seguridad básica)
    const escapar = (texto) => {
      const d = document.createElement('div');
      d.textContent = texto;
      return d.innerHTML;
    };

    function avisar(texto, tipo = 'exito') {
      $('aviso').textContent = texto;
      $('aviso').className = tipo;
      setTimeout(() => { $('aviso').className = ''; }, 4000);
    }

    // ---------- Llamada a la API REST ----------
    async function api(url, opciones = {}) {
      const respuesta = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opciones });
      if (!respuesta.ok) {
        const problema = await respuesta.json().catch(() => ({}));
        const validaciones = problema.errors ? Object.values(problema.errors).flat().join(' ') : null;
        throw new Error(validaciones || problema.detail || 'Ocurrió un error inesperado.');
      }
      return respuesta.status === 204 ? null : respuesta.json();
    }

    // ---------- Llamada a GraphQL ----------
    async function graphql(consulta, variables = {}) {
      const respuesta = await fetch('/graphql', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: consulta, variables })
      });
      const resultado = await respuesta.json();
      if (resultado.errors) throw new Error(resultado.errors[0].message);
      return resultado.data;
    }

    async function cargarProductos() {
      const productos = await api('/api/productos');
      $('productos').innerHTML = productos.length
        ? productos.map(p => `
            <tr>
              <td>${p.id}</td>
              <td>${escapar(p.nombre)}</td>
              <td><span class="badge ${p.stockActual < p.stockMinimo ? 'bajo' : 'ok'}">${p.stockActual}</span></td>
              <td>${p.stockMinimo}</td>
              <td class="acciones">
                <button class="verde" onclick="mover(${p.id}, 'entradas')">+ Entrada</button>
                <button class="rojo" onclick="mover(${p.id}, 'salidas')">− Salida</button>
                <button class="gris" onclick="verHistorial(${p.id})">Historial</button>
                <button class="gris" onclick="eliminar(${p.id})">🗑</button>
              </td>
            </tr>`).join('')
        : '<tr><td colspan="5" class="vacio">Todavía no hay productos. ¡Creá el primero!</td></tr>';
    }

    async function cargarStockBajo() {
      const datos = await graphql('{ stockBajo { id nombre stockActual stockMinimo } }');
      $('stock-bajo').innerHTML = datos.stockBajo.length
        ? datos.stockBajo.map(p => `<li><b>${escapar(p.nombre)}</b>: quedan ${p.stockActual} (mínimo ${p.stockMinimo})</li>`).join('')
        : '<li class="vacio">Todo en orden 🎉</li>';
    }

    async function verHistorial(id) {
      try {
        // UN solo pedido GraphQL trae el producto y su historial
        const datos = await graphql(
          `query($id: Int!) {
             producto(id: $id) { nombre stockActual }
             historial(productoId: $id) { tipo cantidad fecha observacion }
           }`, { id });

        $('titulo-historial').innerHTML =
          `Historial de ${escapar(datos.producto.nombre)} (stock actual: ${datos.producto.stockActual})
           <span class="tag">GraphQL · un solo pedido</span>`;
        $('movimientos').innerHTML = datos.historial.length
          ? datos.historial.map(m => `
              <tr>
                <td>${new Date(m.fecha).toLocaleString('es-AR')}</td>
                <td>${m.tipo}</td>
                <td>${m.cantidad}</td>
                <td>${escapar(m.observacion ?? '')}</td>
              </tr>`).join('')
          : '<tr><td colspan="4" class="vacio">Sin movimientos.</td></tr>';
        $('panel-historial').hidden = false;
        $('panel-historial').scrollIntoView({ behavior: 'smooth' });
      } catch (e) { avisar(e.message, 'error'); }
    }

    async function mover(id, tipo) {
      const cantidad = parseInt(prompt('¿Cuántas unidades?'), 10);
      if (!cantidad) return;
      const observacion = prompt('Observación (opcional):') || null;
      try {
        await api(`/api/productos/${id}/${tipo}`, { method: 'POST', body: JSON.stringify({ cantidad, observacion }) });
        avisar(tipo === 'entradas' ? 'Entrada registrada ✅' : 'Salida registrada ✅');
        await refrescar();
      } catch (e) { avisar(e.message, 'error'); }
    }

    async function eliminar(id) {
      if (!confirm('¿Eliminar este producto?')) return;
      try {
        await api(`/api/productos/${id}`, { method: 'DELETE' });
        avisar('Producto eliminado');
        await refrescar();
      } catch (e) { avisar(e.message, 'error'); }
    }

    $('form-producto').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      try {
        await api('/api/productos', {
          method: 'POST',
          body: JSON.stringify({ nombre: $('nombre').value, stockMinimo: parseInt($('stockMinimo').value, 10) || 0 })
        });
        $('form-producto').reset();
        avisar('Producto creado ✅');
        await refrescar();
      } catch (e) { avisar(e.message, 'error'); }
    });

    const refrescar = () => Promise.all([cargarProductos(), cargarStockBajo()]);
    refrescar().catch(e => avisar(e.message, 'error'));
  </script>
</body>
</html>
